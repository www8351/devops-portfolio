name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only by default. The build job asks for more on its own.
permissions:
  contents: read

# One run per branch or pull request. A new push cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff==0.17.4

      # From app/, like pytest, so ruff sees main.py as first party code.
      - name: Check the code
        working-directory: app
        run: ruff check .

      - name: Check the formatting
        working-directory: app
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install the test requirements
        run: python -m pip install -r app/requirements-dev.txt

      - name: Run the tests
        working-directory: app
        run: pytest

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # 02-docker/Dockerfile.dockerignore is named after the Dockerfile, and only
      # BuildKit reads an ignore file with that name. Without BuildKit the whole
      # repo would go into the build context.
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lowercase. GITHUB_REPOSITORY keeps the case of the owner and repo.
      - name: Set the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build the image
        run: docker build -f 02-docker/Dockerfile --build-arg "APP_VERSION=${GITHUB_SHA}" -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${IMAGE}:${GITHUB_SHA}"
