---
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Create the service group
  ansible.builtin.group:
    name: "{{ app_user }}"
    gid: "{{ base_user_id }}"
    system: true
    state: present

- name: Create the service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    uid: "{{ base_user_id }}"
    group: "{{ app_user }}"
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
    state: present

# The firewall needs the kernel's netfilter, which a plain container does not
# give. SSH is allowed before the firewall is enabled.
- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  tags: [host_only]

- name: Allow the app port through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp
  tags: [host_only]

- name: Deny incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny
  tags: [host_only]

- name: Enable the firewall
  community.general.ufw:
    state: enabled
  tags: [host_only]
