---
# Both tasks need a running Docker engine and a pushed image. The play checks
# app_image_tag in its pre_tasks.
- name: Run the app container
  community.docker.docker_container:
    name: "{{ app_container_name }}"
    image: "{{ app_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ app_port }}:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges
  tags: [host_only]

- name: Wait until /health answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
  register: app_health
  until: app_health.status == 200
  retries: 30
  delay: 2
  tags: [host_only]
