# Example inventory for one server. The host line holds a placeholder for the
# server address. The address comes from the Terraform output in 04-terraform:
#
#   terraform -chdir=04-terraform output -raw public_ip
#
# The README shows the one line that fills it in and writes inventory.ini next
# to this file. Git ignores inventory.ini.

[app]
APP_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/my-key-pair.pem
