name: portfolio

services:
  app:
    build:
      context: ..
      dockerfile: 02-docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: portfolio-app:${APP_VERSION:-0.1.0}
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
